<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navia Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="navbar">
    <h1>Navia Dashboard</h1>
    <div class="controls">
      <button id="themeToggle">Toggle Light/Dark</button>
    </div>
  </header>
  <main class="container">
  <section class="prompt-panel">
    <div class="textareas-row">
      <textarea id="promptInput" placeholder="Type your prompt here..."></textarea>
      <textarea id="enhancedOutput" readonly placeholder="Enhanced prompt will appear here..."></textarea>
    </div>
    <div class="modality-select">
      <!-- All radio buttons start unchecked. Only one can be selected at a time. -->
<label><input type="radio" name="modality" value="image"> Image</label>
<label><input type="radio" name="modality" value="video"> Video</label>
<label><input type="radio" name="modality" value="music"> Music</label>
    </div>
    <div class="actions">
      <button id="enhanceBtn">Enhance Prompt</button>
      <button id="generateBtn">Generate</button>
      <button id="saveBtn">Save Prompt</button>
      <button id="clearBtn">Clear</button>
    </div>
    <div id="status" class="status"></div>
    <div id="imagePreviews" class="image-previews hidden">
      <div>
        <h3>Original Image</h3>
        <img src="{{ url_for('static', filename='images/original.png') }}" alt="Original">
      </div>
      <div>
        <h3>Enhanced Image</h3>
        <img src="{{ url_for('static', filename='images/enhanced.png') }}" alt="Enhanced">
      </div>
    </div>
  </section>
</main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
